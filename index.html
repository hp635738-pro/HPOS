<!doctype html>
<html lang="en" data-hpos-app="hpos">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HPOS</title>
    <script>
      // Dev diagnostics probe: captures what THIS browser actually experiences
      // (first runtime error, failed resources, storage behaviour, #root state)
      // and posts it to the dev server. Removed for production builds.
      ;(function () {
        var errors = []
        var consoleErrors = []
        function cap(list, item) { if (list.length < 10) list.push(item) }
        window.addEventListener('error', function (e) {
          cap(errors, {
            type: 'window.onerror', message: e.message,
            src: e.filename ? String(e.filename).slice(-80) : null,
            line: e.lineno, col: e.colno,
            stack: e.error && e.error.stack ? String(e.error.stack).slice(0, 1200) : null,
          })
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          cap(errors, {
            type: 'unhandledrejection',
            message: r && r.message ? r.message : String(r),
            stack: r && r.stack ? String(r.stack).slice(0, 1200) : null,
          })
        })
        try {
          var origErr = console.error
          console.error = function () {
            cap(consoleErrors, Array.prototype.slice.call(arguments).map(function (a) {
              return (a && a.message) ? a.message + (a.stack ? ' | ' + String(a.stack).slice(0, 600) : '') : String(a)
            }).join(' ').slice(0, 900))
            return origErr.apply(this, arguments)
          }
        } catch (e) {}

        function storageProbe() {
          var out = {}
          try { out.typeofLocalStorage = typeof window.localStorage } catch (e) { out.typeofLocalStorage = 'THROWS:' + e.name }
          try { window.localStorage.getItem('hpos.probe'); out.getItem = 'ok' } catch (e) { out.getItem = 'THROWS:' + e.name + ': ' + e.message }
          try { window.localStorage.setItem('hpos.probe', '1'); out.setItem = 'ok' } catch (e) { out.setItem = 'THROWS:' + e.name + ': ' + e.message }
          try { window.localStorage.removeItem('hpos.probe'); out.removeItem = 'ok' } catch (e) { out.removeItem = 'THROWS:' + e.name }
          return out
        }

        function resources() {
          try {
            return performance.getEntriesByType('resource').slice(0, 60).map(function (r) {
              return { name: String(r.name).split('?')[0].slice(-90), status: r.responseStatus || 0, size: r.transferSize }
            })
          } catch (e) { return [{ name: 'resource-timing-unavailable', status: -1 }] }
        }

        function send(phase) {
          var root = document.getElementById('root')
          var boundary = document.querySelector('[data-hpos-crash-boundary]')
          var report = {
            phase: phase,
            href: location.href,
            ua: navigator.userAgent,
            inIframe: window.self !== window.top,
            rootChildren: root ? root.childElementCount : -1,
            rootHTMLLen: root ? root.innerHTML.length : -1,
            errorBoundaryRendered: !!boundary,
            errorBoundaryText: boundary ? boundary.textContent.slice(0, 400) : null,
            storage: storageProbe(),
            errors: errors,
            consoleErrors: consoleErrors,
            resources: resources(),
          }
          fetch('/__diag/info').then(function (r) { return r.json() }).then(function (info) {
            report.served = info
            return fetch('/src/theme/ThemeContext.jsx').then(function (r) { return r.text() }).then(function (t) {
              report.themeHasStoredPrefsGuard = t.indexOf('storedPrefs') !== -1
              return fetch('/src/main.jsx').then(function (r2) { return r2.text() }).then(function (t2) {
                report.mainHasErrorBoundary = t2.indexOf('ErrorBoundary') !== -1
                return fetch('/__diag/report', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(report),
                }).catch(function () {})
              })
            })
          }).catch(function (e) {
            // last resort: send without server info
            fetch('/__diag/report', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(report),
            }).catch(function () {})
          })
        }
        setTimeout(function () { send('t3') }, 3000)
        setTimeout(function () { send('t8') }, 8000)
      })()
    </script>
  </head>
  <body>
    <img src="/__diag/pixel?m=body" width="1" height="1" alt="" style="display:none" />
    <noscript><img src="/__diag/pixel?m=noscript" width="1" height="1" alt="" /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
