<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HPOS Project</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Welcome to HPOS</h1>
        <p>Edit files in Code Arena and click <strong>Start Preview</strong> to see changes here.</p>
      </header>
      <main>
        <section class="card">
          <h2>Getting Started</h2>
          <ul>
            <li>Edit <code>index.html</code> to change this page</li>
            <li>Edit <code>styles.css</code> to change the look</li>
            <li>Edit <code>src/app.js</code> to add interactivity</li>
          </ul>
        </section>
        <section class="card" id="status">
          <h2>Status</h2>
          <p id="timestamp">Loading…</p>
        </section>
      </main>
    </div>
    <script src="src/app.js"></script>
  </body>
</html>
