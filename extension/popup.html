<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HPOS Bridge</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 280px;
        font: 500 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #16171a;
        color: #f4f5f7;
      }
      main { padding: 14px 14px 16px; }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: -.2px;
      }
      p { margin: 0 0 12px; color: #8e9098; font-size: 12px; }
      button {
        width: 100%;
        height: 34px;
        margin: 0 0 8px;
        border: 0;
        border-radius: 8px;
        background: #3b82f6;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #2a2b30;
        color: #f4f5f7;
        border: 1px solid #3a3b40;
      }
      button:disabled { opacity: .55; cursor: default; }
      #status {
        margin-top: 4px;
        font-size: 12px;
        font-weight: 600;
        color: #c6c8ce;
        min-height: 18px;
      }
      #status[data-tone='ok'] { color: #4ade80; }
      #status[data-tone='err'] { color: #f87171; }
    </style>
  </head>
  <body>
    <main>
      <h1>HPOS Browser Bridge</h1>
      <p>Attach HPOS, then open DeepSeek in another tab (or mark this tab as DeepSeek).</p>
      <button type="button" id="attach">Attach HPOS tab</button>
      <button type="button" id="deepseek" class="secondary">Use this tab as DeepSeek</button>
      <div id="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
