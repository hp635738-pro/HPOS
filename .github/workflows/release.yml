name: Release

# Deliberate release process for the in-app updater (Settings → App → Check for
# Updates). Publishing is what makes electron-builder upload the update
# metadata (latest-linux.yml, latest.yml) next to the artifacts — without it no
# installed app can ever see a new version.
#
#   · every push / tag / manual run  → test + lint + release gate + a full
#                                      Linux build that is VALIDATED and never
#                                      published
#   · pushing a v* tag               → the same validation, then publish
#   · workflow_dispatch (dry_run off)→ the same validation, then publish
#
# The publish job has `needs: [verify, validate]`, so no release can be cut
# from a configuration that does not build exactly the artifacts (and hashes)
# the updater was coded against.
#
# Repository: hp635738-pro/HPOS (pinned in package.json → build.publish and
# asserted by `npm run release:check`).

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validation build only — do not publish anything'
        required: false
        default: true
        type: boolean
      target:
        description: 'What to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - win

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test + lint + release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Release gate (version increment, pinned source, token present)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:check

  validate:
    name: Validate the release artifacts (builds, never publishes)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the Linux targets without publishing (--publish never)
        run: npm run dist:linux
      - name: Assert the artifacts + update metadata are exactly what the updater needs
        run: npm run verify:artifacts -- --summary
      - name: Keep the validated artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: hpos-linux-validated-${{ github.ref_name }}
          path: |
            release/*.deb
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error

  release:
    name: Build + publish ${{ matrix.target }}
    needs: [verify, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    # Publish ONLY for a v* tag push, or a manual run with dry_run switched off.
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true' && (github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target)) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release:* scripts run `release:check` again. The "is this version
      # newer than the published release?" gate already ran in `verify`,
      # before anything was published; offline keeps the second run from
      # tripping over the release this same run creates.
      HPOS_RELEASE_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Publish Linux (AppImage + deb + latest-linux.yml)
        if: matrix.target == 'linux'
        run: npm run release:linux

      - name: Publish Windows (NSIS + latest.yml)
        if: matrix.target == 'win'
        run: npm run release:win

      - name: The release must be published, never a draft
        if: matrix.target == 'linux'
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --prerelease=false

      - name: Verify the published release (assets + metadata + sha512)
        if: matrix.target == 'linux'
        run: npm run verify:release -- --wait --summary

      - name: Keep the published artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: hpos-${{ matrix.target }}-${{ github.ref_name }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/latest*.yml
          if-no-files-found: warn
