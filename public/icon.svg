<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    HPOS application icon source.

    The glyph is the existing HPOS logo mark (the primary path of
    public/favicon.svg), placed on a rounded dark tile that matches the
    application background (#0f1013). Brand purple #863bff is preserved as
    the mid stop of the vertical gradient.

    public/icon.ico (16/24/32/48/64/128/256 px, PNG-compressed entries) is
    generated from this file with an SVG rasterizer plus an ICO packer
    (e.g. resvg + a small PNG-to-ICO script, or ImageMagick with SVG
    support). See README "Windows installer" for details.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262832"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset="0.5" stop-color="#863bff"/>
      <stop offset="1" stop-color="#7a20ff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
