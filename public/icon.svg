<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>HPOS application icon</title>
  <desc>A geometric ice-blue glass H on a rounded graphite tile.</desc>
  <!-- Editable vector companion. The rendered desktop master is icon.png.
       See design/icons/README.md for exports and regeneration. -->
  <defs>
    <path id="tile" d="M324 94H700C854 94 930 170 930 324V700C930 854 854 930 700 930H324C170 930 94 854 94 700V324C94 170 170 94 324 94Z"/>
    <path id="h" d="M340 294H414Q430 294 430 310V450Q430 464 444 464H580Q594 464 594 450V310Q594 294 610 294H684Q700 294 700 310V714Q700 730 684 730H610Q594 730 594 714V574Q594 560 580 560H444Q430 560 430 574V714Q430 730 414 730H340Q324 730 324 714V310Q324 294 340 294Z"/>
    <linearGradient id="rim" x1="512" y1="94" x2="512" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91b2bf"/>
      <stop offset=".22" stop-color="#3e515b"/>
      <stop offset=".7" stop-color="#1a2026"/>
      <stop offset="1" stop-color="#3a464d"/>
    </linearGradient>
    <linearGradient id="graphite" x1="512" y1="104" x2="512" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34444f"/>
      <stop offset=".45" stop-color="#242d35"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
    <radialGradient id="ambient" cx="512" cy="142" r="540" gradientTransform="translate(0 64) scale(1 .55)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78cde7" stop-opacity=".19"/>
      <stop offset="1" stop-color="#78cde7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="512" y1="294" x2="512" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5f8fc"/>
      <stop offset=".4" stop-color="#b4e3eb"/>
      <stop offset=".7" stop-color="#83b7c8"/>
      <stop offset="1" stop-color="#659bac"/>
    </linearGradient>
    <linearGradient id="bevel" x1="512" y1="294" x2="512" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d5fcff"/>
      <stop offset=".48" stop-color="#8bdeec"/>
      <stop offset=".8" stop-color="#4d899c"/>
      <stop offset="1" stop-color="#a5dce5"/>
    </linearGradient>
    <radialGradient id="reflection" cx="512" cy="464" r="240" gradientTransform="translate(0 301.6) scale(1 .35)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecffff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ecffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeLight" x1="300" y1="104" x2="724" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7cdcff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9ee8ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7cdcff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="270" y="258" width="484" height="542" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13"/>
      <feOffset dy="17"/>
      <feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <use href="#tile" fill="url(#rim)"/>
  <use href="#tile" transform="translate(6.144 6.144) scale(.988)" fill="#101c23"/>
  <use href="#tile" transform="translate(10.752 10.752) scale(.979)" fill="url(#graphite)"/>
  <use href="#tile" transform="translate(10.752 10.752) scale(.979)" fill="url(#ambient)"/>
  <path d="M300 104H724" stroke="url(#edgeLight)" stroke-width="3" stroke-linecap="round"/>
  <g filter="url(#lift)">
    <use href="#h" fill="url(#glass)" stroke="url(#bevel)" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill"/>
    <use href="#h" fill="url(#reflection)" stroke="#d7fcff" stroke-opacity=".32" stroke-width="1.5"/>
  </g>
</svg>
